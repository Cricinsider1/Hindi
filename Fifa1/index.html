    <script>
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const loader = document.getElementById('loading-screen');
                const mainApp = document.getElementById('main-content');
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
                mainApp.style.display = 'block';
                setTimeout(() => {
                    mainApp.style.opacity = '1';
                    mainApp.style.visibility = 'visible';
                }, 50);
            }, 2200);
        });

        // ---------- STREAM ID (JSON) LOGIC ----------
        const JSON_SOURCE_URL_PRIMARY = 'https://allrounderid2.pages.dev/id.json';
        const JSON_SOURCE_URL_SECONDARY = '';

        function getStreamIdFromUrl() {
            const params = new URLSearchParams(window.location.search);
            return params.get('stream');
        }

        function playFromStreamData(item) {
            const statusText = document.getElementById('portalStatusText');
            const player = document.getElementById('videoPlayer');
            const streamLabel = document.getElementById('streamLabel');

            if (item && item.iframeSrc && item.iframeSrc.trim() !== "") {
                statusText.style.display = 'none';
                player.style.display = 'block';
                player.src = item.iframeSrc;
                streamLabel.innerText = item.name || item.id;

                // optional hit counter ping (fire and forget, ignore failures)
                if (item.hit) {
                    fetch(item.hit).catch(() => {});
                }
            } else {
                player.style.display = 'none';
                player.src = "";
                statusText.style.display = 'block';
                statusText.innerHTML = "STREAM NOT FOUND<br>SELECT AN AVAILABLE OPTION";
                streamLabel.innerText = "INVALID STREAM ID";
            }
        }

        async function loadStreamFromId() {
            let streamId = getStreamIdFromUrl();
            if (!streamId) return; // nothing to do, default UI stays

            // prefix-based source resolution: "a:" -> secondary source (eerajson)
            let sourceUrl = JSON_SOURCE_URL_PRIMARY;
            if (streamId.toLowerCase().startsWith('a:')) {
                sourceUrl = JSON_SOURCE_URL_SECONDARY;
                streamId = streamId.slice(2); // strip the "a:" prefix before matching
            }

            const statusText = document.getElementById('portalStatusText');
            const streamLabel = document.getElementById('streamLabel');
            statusText.innerHTML = "LOADING STREAM...";
            streamLabel.innerText = "LOADING...";

            try {
                const res = await fetch(sourceUrl, { cache: 'no-store' });
                if (!res.ok) throw new Error('Bad response');
                const data = await res.json();

                let match = null;
                if (sourceUrl === JSON_SOURCE_URL_SECONDARY) {
                    // secondary source is a flat { key: "streamUrl" } object
                    const foundKey = Object.keys(data).find(k => k.toLowerCase() === streamId.toLowerCase());
                    if (foundKey) {
                        match = { id: foundKey, name: foundKey, iframeSrc: data[foundKey] };
                    }
                } else {
                    // primary source is { iframes: [ { id, iframeSrc, name }, ... ] }
                    const list = data.iframes || [];
                    match = list.find(it => it.id === streamId);
                }

                if (match) {
                    playFromStreamData(match);
                } else {
                    statusText.style.display = 'block';
                    statusText.innerHTML = "STREAM NOT FOUND<br>CHECK THE LINK AND TRY AGAIN";
                    streamLabel.innerText = "INVALID STREAM ID";
                }
            } catch (err) {
                statusText.style.display = 'block';
                statusText.innerHTML = "FAILED TO LOAD STREAM DATA<br>PLEASE TRY AGAIN LATER";
                streamLabel.innerText = "ERROR";
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadStreamFromId();
        });
    </script>
