const video = document.getElementById("video");
const statusEl = document.getElementById("status");

let player = null;
let usingNative = false;
let fallbackDone = false;
let reconnecting = false;
let reconnectAttempts = 0;
let nativeRetryUsed = false;
let resumePosition = null;
let lastPosition = 0;
let initStarted = false;

function showStatus(message, clickable = false) {
  statusEl.textContent = message;
  statusEl.style.pointerEvents = clickable ? "auto" : "none";
}

function currentPosition() {
  const value = Number(video.currentTime);
  return Number.isFinite(value) && value >= 0 ? value : null;
}

function positionForReload() {
  if (resumePosition !== null) return resumePosition;
  if (lastPosition > 0) return lastPosition;
  const current = currentPosition();
  return current !== null && current > 0 ? current : null;
}

video.addEventListener("timeupdate", () => {
  if (!video.paused) {
    const value = currentPosition();
    if (value !== null) lastPosition = value;
  }
});

video.addEventListener("pause", () => {
  if (!video.ended) {
    const value = currentPosition();
    if (value !== null && value > 0) {
      resumePosition = value;
      lastPosition = value;
    }
  }
});

video.addEventListener("seeked", () => {
  const value = currentPosition();
  if (value !== null) {
    lastPosition = value;
    if (video.paused) resumePosition = value;
  }
});

function getSeekRange() {
  if (!usingNative && player) {
    try {
      const range = player.seekRange();
      if (range && Number.isFinite(range.start) && Number.isFinite(range.end) && range.end > range.start) {
        return range;
      }
    } catch (e) {}
  }

  try {
    const ranges = video.seekable;
    if (ranges && ranges.length) {
      const last = ranges.length - 1;
      return { start: ranges.start(last), end: ranges.end(last) };
    }
  } catch (e) {}

  if (Number.isFinite(video.duration) && video.duration > 0) {
    return { start: 0, end: video.duration };
  }
  return null;
}
function restoreSavedPosition() {
  if (resumePosition === null) return;

  const target = resumePosition;
  const range = getSeekRange();
  if (!range) return;

  if (target < range.start - 0.5) {
    resumePosition = null;
    showStatus("Paused point is no longer available in this live stream");
    return;
  }

  const safeEnd = Math.max(range.start, range.end - 0.15);
  const safeTarget = Math.min(Math.max(target, range.start), safeEnd);

  try {
    if (Math.abs(video.currentTime - safeTarget) > 0.35) {
      video.currentTime = safeTarget;
    }
    resumePosition = null;
    lastPosition = safeTarget;
  } catch (e) {
    // Keep resumePosition; another media event will retry the seek.
  }
}

video.addEventListener("play", () => {
  restoreSavedPosition();
  if (resumePosition !== null) requestAnimationFrame(restoreSavedPosition);
});
video.addEventListener("loadedmetadata", restoreSavedPosition);
video.addEventListener("canplay", restoreSavedPosition);
video.addEventListener("progress", restoreSavedPosition);
video.addEventListener("playing", () => showStatus(""));

statusEl.addEventListener("click", async () => {
  try {
    if (video.muted) {
      video.muted = false;
      video.volume = 1;
    }
    if (video.paused) await video.play();
    showStatus("");
  } catch (e) {
    showStatus("Tap to play", true);
  }
});

async function startWithAudioFallback() {
  try {
    video.muted = false;
    video.volume = 1;
    await video.play();
    showStatus("");
  } catch (e) {
    try {
      video.muted = true;
      await video.play();
      showStatus("Tap to unmute", true);
    } catch (e2) {
      showStatus("Tap to play", true);
    }
  }
}

async function runNativeFallback(url) {
  if (fallbackDone) return;
  fallbackDone = true;
  usingNative = true;

  const saved = positionForReload();
  if (saved !== null) resumePosition = saved;

  if (player) {
    try { await player.unload(); } catch (e) {}
  }

  video.src = url;
  video.load();
  await startWithAudioFallback();
}
video.addEventListener("error", () => {
  if (!usingNative || !fallbackDone) return;
  if (!nativeRetryUsed) {
    nativeRetryUsed = true;
    const saved = positionForReload();
    if (saved !== null) resumePosition = saved;
    showStatus("Reconnecting...");
    setTimeout(async () => {
      video.src = STREAM_URL;
      video.load();
      await startWithAudioFallback();
    }, 1200);
  } else {
    showStatus("Stream offline");
  }
});

async function reconnectShaka() {
  if (reconnecting || fallbackDone) return;
  if (reconnectAttempts >= 1) {
    await runNativeFallback(STREAM_URL);
    return;
  }

  reconnecting = true;
  reconnectAttempts++;
  showStatus("Reconnecting...");

  const saved = positionForReload();
  if (saved !== null) resumePosition = saved;

  try {
    await player.load(STREAM_URL, saved);
    await startWithAudioFallback();
  } catch (e) {
    await runNativeFallback(STREAM_URL);
  } finally {
    reconnecting = false;
  }
}

async function initPlayer() {
  if (initStarted) return;
  if (!STREAM_URL || STREAM_URL === "PASTE_YOUR_STREAM_LINK_HERE") {
    showStatus("Add your stream link in STREAM_URL");
    return;
  }

  if (!window.shaka || !shaka.Player) {
    await runNativeFallback(STREAM_URL);
    return;
  }

  shaka.polyfill.installAll();
  if (!shaka.Player.isBrowserSupported()) {
    await runNativeFallback(STREAM_URL);
    return;
  }

  if (!video.ui) {
    setTimeout(initPlayer, 60);
    return;
  }

  initStarted = true;
  const ui = video.ui;
  const controls = ui.getControls();
  player = controls.getPlayer();

  ui.configure({
    addSeekBar: true,
    controlPanelElements: ["play_pause", "mute", "volume", "spacer", "quality", "fullscreen"],
    overflowMenuButtons: ["quality", "playback_rate"]
  });

  player.configure({
    streaming: {
      bufferingGoal: 25,
      rebufferingGoal: 2,
      bufferBehind: 45,
      retryParameters: {
        maxAttempts: 4,
        baseDelay: 800,
        backoffFactor: 1.5
      }
    },
    abr: {
      enabled: true,
      switchInterval: 5,
      bandwidthDowngradeTarget: 0.85,
      bandwidthUpgradeTarget: 0.75,
      droppedFrames: true
    }
  });

  player.addEventListener("error", reconnectShaka);

  try {
    await player.load(STREAM_URL);
    await startWithAudioFallback();
  } catch (e) {
    await runNativeFallback(STREAM_URL);
  }
}

document.addEventListener("shaka-ui-loaded", initPlayer, { once: true });
document.addEventListener("shaka-ui-load-failed", () => {
  if (STREAM_URL && STREAM_URL !== "PASTE_YOUR_STREAM_LINK_HERE") {
    runNativeFallback(STREAM_URL);
  }
}, { once: true });
if ("wakeLock" in navigator) {
