<style>

:root {
    --bg-color: #070b1a;
    --primary-red: #4f46e5;
    --primary-red-dark: #9333ea;
    --card-bg: #0f172a;
    --text-light: #e2e8f0;
    --text-muted: #94a3b8;
    --border-color: #1e293b;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Poppins', sans-serif;
    background-color: var(--bg-color);
    color: var(--text-light);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 1rem;
}

.container {
    width: 100%;
    max-width: 800px;
    margin: 0 auto;
    animation: fadeIn 0.5s ease-out forwards;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* VIDEO PLAYER */

#player-container {
    width: 100%;
    aspect-ratio: 16/9;
    max-height: 70vh;
    background-color: #000;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
}

/* INFO CARD */

.info-card {
    background-color: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 1.25rem;
    margin-top: 1rem;
    text-align: center;
}

.info-card h2 {
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 1rem;
    color: var(--text-muted);
}

/* TELEGRAM BUTTON */

.action-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
    width: 100%;
    padding: 0.8rem 1rem;
    border-radius: 8px;
    background: linear-gradient(90deg, var(--primary-red), var(--primary-red-dark));
    color: white;
    font-weight: 600;
    text-decoration: none;
    border: none;
    cursor: pointer;
    transition: 0.2s ease;
}

.action-button:hover {
    transform: translateY(-2px);
}

/* CLICKABLE BANNER */

.banner-container {
    width: 100%;
    margin-top: 1rem;
    overflow: hidden;
    border-radius: 12px;
}

.banner-container a {
    display: block;
    width: 100%;
}

.banner-container img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 12px;
}

/* WHATSAPP BUTTON */

.whatsapp-button {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 14px;
    margin-top: 1rem;
    background: #25D366;
    color: white;
    text-decoration: none;
    font-size: 16px;
    font-weight: 700;
    border-radius: 10px;
    transition: 0.2s ease;
}

.whatsapp-button i {
    font-size: 23px;
}

.whatsapp-button:hover {
    background: #1ebe5d;
    transform: translateY(-2px);
}

/* SMALL TELEGRAM IMAGE BUTTON */

.small-telegram-button {
    width: 75%;
    max-width: 420px;
    margin: 12px auto 0;
    display: block;
    transition: 0.2s ease;
}

.small-telegram-button img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 10px;
}

.small-telegram-button:hover {
    transform: translateY(-2px);
}

/* BACK LINK */

.back-link {
    display: block;
    text-align: center;
    margin-top: 1.5rem;
    color: var(--text-muted);
    text-decoration: none;
    padding: 0.5rem;
    border-radius: 8px;
}

.back-link:hover {
    background-color: var(--card-bg);
    color: var(--text-light);
}

/* MOBILE RESPONSIVE */

@media (max-width: 600px) {

    .whatsapp-button {
        font-size: 15px;
    }

    .small-telegram-button {
        width: 75%;
    }

}

</style>
