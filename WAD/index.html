<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e13">

<title>TG_@Cricinsider365</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{--r:16px}

html[data-theme=dark]{
color-scheme:dark;
--bg:#0b0e13;
--card:#11151c;
--solid:#151a22;
--bar:rgba(11,14,19,.8);
--text:#ece9e2;
--muted:#8b909a;
--line:rgba(236,233,226,.09);
--line2:rgba(236,233,226,.18);
--accent:#c9a86a;
--ink:#17130a;
--wash:rgba(201,168,106,.07);
--red:#c0443c;
--redt:#e0675f;
--ok:#4c9a6a;
--pulse:rgba(201,168,106,.22);
--shadow:0 22px 50px -26px rgba(0,0,0,.85)
}

html[data-theme=light]{
color-scheme:light;
--bg:#f5f3ee;
--card:#fff;
--solid:#fff;
--bar:rgba(245,243,238,.82);
--text:#15181d;
--muted:#6a6f78;
--line:rgba(21,24,29,.1);
--line2:rgba(21,24,29,.2);
--accent:#8a6a2c;
--ink:#fff;
--wash:rgba(138,106,44,.09);
--red:#c0443c;
--redt:#b3342d;
--ok:#2f7d4f;
--pulse:rgba(138,106,44,.22);
--shadow:0 20px 40px -26px rgba(40,30,10,.35)
}

*,*::before,*::after{
box-sizing:border-box;
margin:0;
padding:0;
-webkit-tap-highlight-color:transparent
}

html,body{
min-height:100%;
background:var(--bg)
}

body{
font-family:Manrope,system-ui,sans-serif;
color:var(--text);
min-height:100vh;
overflow-x:hidden;
background-image:radial-gradient(900px 420px at 50% -140px,var(--wash),transparent 70%)
}

button,a{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}

.page{
width:100%;
max-width:1120px;
margin:auto;
padding:0 16px 32px
}

/* HEADER */

.topbar{
position:sticky;
top:0;
z-index:50;
margin:10px 0 18px;
padding:9px 10px 9px 14px;
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
border-radius:14px;
background:var(--bar);
border:1px solid var(--line);
backdrop-filter:blur(16px)
}

.brand{
display:flex;
align-items:center;
gap:10px;
text-decoration:none
}

.logo{
width:32px;
height:32px;
border-radius:9px;
display:grid;
place-items:center;
background:var(--accent);
color:var(--ink);
font-size:18px;
font-weight:800
}

.brand-name{
font-weight:800;
font-size:16px;
letter-spacing:.04em
}

.live-pill{
display:inline-flex;
align-items:center;
gap:7px;
padding:5px 10px;
border-radius:999px;
background:rgba(192,68,60,.12);
border:1px solid rgba(192,68,60,.3);
color:var(--redt);
font-size:11.5px;
font-weight:700
}

.live-pill:before{
content:"";
width:6px;
height:6px;
border-radius:50%;
background:var(--red);
animation:blink 2s infinite
}

@keyframes blink{
50%{opacity:.35}
}

.toggle{
width:40px;
height:40px;
border-radius:11px;
display:grid;
place-items:center;
background:var(--card);
border:1px solid var(--line);
color:var(--accent);
font-size:20px
}

/* LAYOUT */

.layout{
display:grid;
gap:18px;
grid-template-columns:minmax(0,1fr)
}

.col{
display:flex;
flex-direction:column;
gap:18px;
min-width:0
}

@media(min-width:960px){
.layout{
grid-template-columns:minmax(0,1fr) 340px;
align-items:start
}
.side{
position:sticky;
top:84px
}
}

/* PLAYER */

.frame{
position:relative;
border-radius:var(--r);
border:1px solid var(--line2);
background:#000;
box-shadow:var(--shadow)
}

.stage{
position:relative;
aspect-ratio:16/9;
background:#000;
border-radius:15px;
overflow:hidden
}

#player-container{
position:absolute;
inset:0;
background:#000
}

#player-container iframe{
position:absolute;
inset:0;
width:100%;
height:100%;
border:0;
display:block
}

.stage-tag{
position:absolute;
top:12px;
left:12px;
z-index:5;
display:flex;
align-items:center;
gap:6px;
padding:5px 10px;
border-radius:6px;
background:#b9382f;
color:white;
font-size:11px;
font-weight:700;
pointer-events:none
}

.stage-tag i{
width:5px;
height:5px;
background:white;
border-radius:50%;
animation:blink 2s infinite
}

/* STATUS */

.bar{
display:flex;
align-items:center;
gap:8px
}

.chip{
display:inline-flex;
align-items:center;
gap:8px;
padding:9px 14px;
border-radius:10px;
font-size:12.5px;
font-weight:600;
background:var(--card);
border:1px solid var(--line)
}

.chip .d{
width:7px;
height:7px;
border-radius:50%;
background:var(--ok)
}

/* PROMO BANNER */

.promo-head{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
margin-bottom:10px
}

.promo-head b{
font-size:13.5px;
font-weight:700
}

.promo-head small{
font-size:11px;
color:var(--muted)
}

.frame.soft{
box-shadow:none;
background:var(--solid);
animation:glow 2.8s infinite
}

@keyframes glow{
50%{
border-color:var(--accent);
box-shadow:0 0 0 4px var(--pulse)
}
}

.promo-wrapper{
position:relative;
overflow:hidden;
border-radius:var(--r)
}

.promo-link{
display:block;
width:100%;
overflow:hidden;
border-radius:15px;
background:var(--solid)
}

.promo-link img{
display:block;
width:100%;
height:auto;
object-fit:contain
}

/* WHATSAPP BUTTON INSIDE BANNER */

.get-id-link{
position:absolute;
top:8%;
right:3%;
z-index:5;

display:flex;
align-items:center;
justify-content:center;
gap:12px;

padding:13px 24px;

background:linear-gradient(135deg,#171416,#100f10);

border:2px solid #555;
border-radius:35px;

color:#fff;
text-decoration:none;

font-size:16px;
font-weight:800;
white-space:nowrap;

box-shadow:0 4px 15px rgba(0,0,0,.5);
transition:.2s ease
}

.get-id-link:hover{
transform:translateY(-2px);
background:#201c1e
}

.get-id-link:active{
transform:scale(.97)
}

.whatsapp-icon{
width:38px;
height:38px;
flex-shrink:0;
fill:#25D366
}

/* TELEGRAM CARDS */

.label{
font-size:12.5px;
font-weight:600;
color:var(--muted);
margin-bottom:10px
}

.card{
border-radius:var(--r);
background:var(--card);
border:1px solid var(--line)
}

.tg{
display:flex;
align-items:center;
gap:14px;
padding:15px;
text-decoration:none
}

.tg-ic{
width:44px;
height:44px;
flex:none;
border-radius:12px;
display:grid;
place-items:center;
color:var(--accent);
background:var(--solid);
border:1px solid var(--line2);
font-size:22px
}

.tg-tx{
flex:1;
min-width:0
}

.tg-tx b{
display:block;
font-size:14.5px;
font-weight:700
}

.tg-tx small{
display:block;
margin-top:2px;
font-size:12px;
color:var(--muted);
line-height:1.45
}

.tg-ar{
font-size:22px;
color:var(--muted)
}

/* SHARE */

.share{
width:100%;
display:flex;
align-items:center;
justify-content:center;
gap:10px;
padding:14px 16px;
border-radius:12px;
font-size:14.5px;
font-weight:700;
background:var(--accent);
color:var(--ink);
transition:.2s
}

.share:hover{
filter:brightness(1.07)
}

.share:active{
transform:scale(.99)
}

.credit{
text-align:center;
padding:6px 8px;
font-size:12px;
color:var(--muted)
}

.credit b{
color:var(--text)
}

/* ANIMATION */

.in{
animation:up .6s ease both
}

@keyframes up{
from{
opacity:0;
transform:translateY(8px)
}
to{
opacity:1;
transform:none
}
}

/* TOAST */

.toast{
position:fixed;
left:50%;
bottom:25px;
transform:translateX(-50%);
z-index:1000;
padding:10px 18px;
border-radius:10px;
background:var(--solid);
border:1px solid var(--line2);
font-size:12px;
opacity:0;
pointer-events:none;
transition:.2s
}

.toast.show{
opacity:1
}

/* MOBILE */

@media(max-width:560px){

.page{
padding:0 12px 28px
}

.brand-name{
font-size:15px
}

.get-id-link{
top:8%;
right:3%;
padding:7px 12px;
gap:7px;
font-size:11px;
border-radius:25px;
border-width:1.5px
}

.whatsapp-icon{
width:23px;
height:23px
}

}

@media(prefers-reduced-motion:reduce){
*,*::before,*::after{
animation-duration:.001ms!important;
animation-iteration-count:1!important;
transition-duration:.001ms!important
}
}

</style>
</head>

<script>

/* DIRECT IFRAME URL */

const IFRAME_URL = "https://insider365.pages.dev/T4";

document.querySelector("#player-container iframe").src = IFRAME_URL;


/* THEME SWITCH */

const themeToggle = document.getElementById("themeToggle");

try{

const savedTheme = localStorage.getItem("cxp_theme");

if(savedTheme === "light"){

document.documentElement.setAttribute("data-theme","light");

themeToggle.textContent = "☀";

}

}catch(e){}

themeToggle.addEventListener("click",function(){

const next =
document.documentElement.getAttribute("data-theme") === "light"
? "dark"
: "light";

document.documentElement.setAttribute("data-theme",next);

themeToggle.textContent =
next === "light" ? "☀" : "☾";

try{
localStorage.setItem("cxp_theme",next);
}catch(e){}

});


/* SHARE BUTTON */

const toast = document.getElementById("toast");

function showToast(message){

toast.textContent = message;

toast.classList.add("show");

setTimeout(function(){

toast.classList.remove("show");

},2500);

}

document.getElementById("shareStreamBtn").addEventListener("click",async function(){

const url = window.location.href;

try{

if(navigator.share){

await navigator.share({
title:"Cricinsider365 Live",
text:"Watch live streaming",
url:url
});

}else{

await navigator.clipboard.writeText(url);

showToast("Link copied to clipboard");

}

}catch(e){

if(e.name !== "AbortError"){

try{

await navigator.clipboard.writeText(url);

showToast("Link copied to clipboard");

}catch(err){

showToast("Unable to copy link");

}

}

}

});

</script>
